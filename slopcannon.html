<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slopcannon.com</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'VT323', monospace;
            overflow: hidden;
        }
        #game-container { width: 800px; }
        #header {
            background: #00ff00;
            color: #000;
            padding: 8px 16px;
            font-size: 28px;
            text-align: center;
            letter-spacing: 4px;
        }
        #game {
            position: relative;
            width: 800px;
            height: 450px;
            background: #0a0a0a;
            border: 4px solid #00ff00;
            border-top: none;
            overflow: hidden;
        }
        #cutscene, #gameplay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 360px;
        }
        #dialogue-area {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 90px;
            background: #000;
            border-top: 3px solid #00ff00;
            padding: 12px 24px;
            display: none;
        }
        #speaker { color: #00ff00; font-size: 22px; margin-bottom: 6px; }
        #text { color: #fff; font-size: 24px; line-height: 1.3; }
        #skip-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: transparent;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 8px 16px;
            font-family: 'VT323', monospace;
            font-size: 18px;
            cursor: pointer;
            z-index: 100;
        }
        #skip-btn:hover { background: #00ff00; color: #000; }
        #gameplay { display: none; }
        #score {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #00ff00;
            font-size: 28px;
            z-index: 10;
        }
        #instructions {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #004400;
            font-size: 20px;
            z-index: 10;
        }
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }
        #game-over h1 { color: #ff0000; font-size: 56px; margin-bottom: 20px; }
        #game-over p { color: #00ff00; font-size: 28px; margin-bottom: 40px; }
        #restart-btn {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 20px 40px;
            font-family: 'VT323', monospace;
            font-size: 24px;
            cursor: pointer;
        }
        canvas { display: block; image-rendering: pixelated; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="header">slopcannon.com</div>
        <div id="game">
            <button id="skip-btn">SKIP >></button>
            <div id="cutscene"><canvas id="cs-canvas" width="800" height="360"></canvas></div>
            <div id="dialogue-area"><div id="speaker"></div><div id="text"></div></div>
            <div id="gameplay"><canvas id="gp-canvas" width="800" height="360"></canvas><div id="score">TOKENS: 0</div><div id="instructions">[SPACE] to jump</div></div>
            <div id="game-over"><h1>GAME OVER</h1><p>Final Tokens: <span id="final-score">0</span></p><button id="restart-btn">PLAY AGAIN</button></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('cs-canvas');
        const ctx = canvas.getContext('2d');
        const gpCanvas = document.getElementById('gp-canvas');
        const gpCtx = gpCanvas.getContext('2d');
        const dialogueArea = document.getElementById('dialogue-area');
        const speakerEl = document.getElementById('speaker');
        const textEl = document.getElementById('text');
        const skipBtn = document.getElementById('skip-btn');
        const gameplay = document.getElementById('gameplay');
        const scoreEl = document.getElementById('score');
        const gameOver = document.getElementById('game-over');
        const finalScoreEl = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');

        let frame = 0, scene = 0, timer = 0, tokens = 0, gameRunning = false;
        const programmer = { x: -60, y: 230, vx: 0, emotion: 'neutral' };
        const boss = { x: 860, y: 220, emotion: 'neutral' };
        const player = { x: 80, y: 270, vy: 0, grounded: true };
        let obstacles = [], obstacleTimer = 0;

        // Story: scene = [type, duration(frames), params...]
        const story = [
            // 0-1: Walk in
            ['walk', 90], ['boss_in', 60],
            // 2-4: Number dialogue
            ['dlog', 100, 'BOSS', 'Think of a number between 1 and 10'],
            ['dlog', 60, 'PROGRAMMER', '7'],
            ['dlog', 100, 'BOSS', 'Great. Now automate that.'],
            // 5: Boss leaves, 6: Code, 7: Message
            ['boss_out', 50], ['code', 120], ['msg', 80, 'I did it!'],
            // 8-10: Boss returns angry
            ['boss_in', 50], ['dlog', 120, 'BOSS', "You're not using enough tokens!"],
            ['boss_out', 50],
            // 11-14: Claude, v2, message
            ['claude', 100], ['ai', 120], ['msg', 80, 'I did it using AI'],
            // 15-17: Boss returns, dashboard
            ['boss_in', 50], ['dlog', 150, 'BOSS', "Great! Check the dashboard. Don't fall behind."],
            ['boss_out', 50], ['leader', 120, 10],
            // 18-20: Loop
            ['dlog', 80, 'PROGRAMMER', 'Claude, get me to first!'],
            ['loop', 80], ['run', 100],
            // 21-24: Climbing
            ['leader', 50, 9], ['recurs', 60], ['run2', 80],
            ['leader', 40, 7], ['leader', 40, 5], ['leader', 40, 3],
            // 25: Win
            ['leader', 60, 1], ['dlog', 120, 'BOSS', "You're doing great! Keep it up!"],
            // 26: Infinite
            ['infinite', 150], ['game', 0]
        ];

        // Draw pixel art programmer (better looking)
        function drawProg(x, y, emo) {
            ctx.fillStyle = '#00ff00';
            // Body
            ctx.fillRect(x+16, y+28, 24, 20);
            ctx.fillRect(x+12, y+48, 32, 28);
            // Head
            ctx.fillStyle = '#88ff88';
            ctx.fillRect(x+16, y+8, 24, 20);
            ctx.fillRect(x+14, y+10, 28, 18);
            // Hair
            ctx.fillStyle = '#006600';
            ctx.fillRect(x+14, y+4, 28, 8);
            // Face
            ctx.fillStyle = '#004400';
            if (emo === 'happy') {
                ctx.fillRect(x+18, y+14, 4, 4);
                ctx.fillRect(x+30, y+14, 4, 4);
                ctx.fillRect(x+20, y+22, 16, 2);
            } else if (emo === 'stressed') {
                ctx.fillRect(x+16, y+12, 6, 3);
                ctx.fillRect(x+30, y+12, 6, 3);
                ctx.fillRect(x+20, y+24, 16, 2);
            } else if (emo === 'thinking') {
                ctx.fillRect(x+18, y+14, 3, 3);
                ctx.fillRect(x+31, y+14, 3, 3);
            } else {
                ctx.fillRect(x+18, y+14, 4, 4);
                ctx.fillRect(x+30, y+14, 4, 4);
            }
            // Arms
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(x, y+30, 14, 8);
            ctx.fillRect(x+42, y+30, 14, 8);
            // Legs
            ctx.fillRect(x+14, y+76, 10, 20);
            ctx.fillRect(x+32, y+76, 10, 20);
            // Glasses
            ctx.fillStyle = '#004400';
            ctx.fillRect(x+16, y+14, 26, 2);
        }

        function drawBoss(x, y) {
            ctx.fillStyle = '#00ff00';
            // Body
            ctx.fillRect(x+12, y+28, 32, 24);
            ctx.fillRect(x+8, y+52, 40, 24);
            // Head
            ctx.fillStyle = '#88ff88';
            ctx.fillRect(x+14, y+6, 28, 22);
            // Hair
            ctx.fillStyle = '#004400';
            ctx.fillRect(x+12, y, 32, 8);
            // Face
            ctx.fillStyle = '#004400';
            ctx.fillRect(x+16, y+12, 6, 4);
            ctx.fillRect(x+34, y+12, 6, 4);
            // Suit
            ctx.fillStyle = '#00aa00';
            ctx.fillRect(x+20, y+30, 16, 20);
            // Tie
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(x+24, y+32, 8, 14);
            // Legs
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(x+12, y+76, 12, 18);
            ctx.fillRect(x+32, y+76, 12, 18);
        }

        function drawPC(x, y) {
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(x, y, 100, 70);
            ctx.fillStyle = '#001100';
            ctx.fillRect(x+4, y+4, 92, 62);
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(x+8, y+8, 84, 54);
            ctx.fillStyle = '#001100';
            ctx.fillRect(x+40, y+70, 20, 15);
            ctx.fillRect(x+20, y+85, 60, 4);
        }

        function drawFile(name, x, y) {
            ctx.fillStyle = '#00ff00';
            ctx.font = '18px VT323';
            ctx.fillText(name, x, y);
        }

        function drawBubble(text, x, y) {
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(x, y, 200, 50);
            ctx.fillStyle = '#001100';
            ctx.font = '20px VT323';
            ctx.fillText(text, x+10, y+32);
        }

        function drawBoard(place) {
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(200, 20, 400, 320);
            ctx.fillStyle = '#001100';
            ctx.fillRect(210, 30, 380, 300);
            ctx.font = '28px VT323';
            ctx.fillText('TOKEN LEADERBOARD', 260, 70);
            const names = ['YOU', 'BOSS', 'JENNY', 'MIKE', 'SARAH', 'TOM', 'LISA', 'JOHN', 'EMMA', 'DAVE'];
            const scores = [place===1?9999:(10-place)*1000+500, 9999, 8500, 7200, 6100, 5500, 4800, 4200, 3500, 2800];
            for (let i=0; i<10; i++) {
                ctx.fillStyle = (i+1)===place ? '#ffff00' : '#00ff00';
                ctx.font = '22px VT323';
                ctx.fillText((i+1)+'. '+names[i]+'  '+scores[i], 240, 110+i*26);
            }
        }

        function drawStars() {
            ctx.fillStyle = '#003300';
            for (let i=0; i<40; i++) ctx.fillRect((i*97+frame*0.2)%800, (i*53)%200, 2, 2);
        }

        function update() {
            frame++;
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, 800, 360);
            drawStars();
            ctx.fillStyle = '#002200';
            ctx.fillRect(0, 330, 800, 30);
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(0, 330, 800, 2);

            if (scene >= story.length) { startGame(); return; }

            const [type, dur, ...args] = story[scene];
            timer++;

            drawPC(520, 220);
            drawProg(programmer.x, programmer.y, programmer.emotion);

            if (type === 'walk') {
                programmer.x = Math.min(programmer.x + 6, 180);
            } else if (type === 'boss_in') {
                boss.x = Math.max(boss.x - 7, 420);
                drawBoss(boss.x, boss.y);
            } else if (type === 'boss_out') {
                drawBoss(boss.x, boss.y);
                boss.x += 7;
                programmer.emotion = 'stressed';
            } else if (type === 'dlog') {
                const [spk, txt] = args;
                dialogueArea.style.display = 'block';
                speakerEl.textContent = spk;
                textEl.textContent = txt;
                drawBoss(boss.x, boss.y);
                programmer.emotion = spk==='BOSS' ? 'stressed' : 'thinking';
                if (spk==='PROGRAMMER' && txt==='7') {
                    ctx.fillStyle = '#00ff00'; ctx.font = '32px VT323';
                    ctx.fillText('7', programmer.x+70, programmer.y-10);
                }
            } else if (type === 'code') {
                drawFile('random_number_generator/', 320, 150);
                drawFile('random_number_generator.py', 320, 185);
            } else if (type === 'msg') {
                drawFile('random_number_generator.py', 320, 185);
                drawBubble(args[0], 480, 120);
                programmer.emotion = 'happy';
            } else if (type === 'claude') {
                drawFile('random_number_generator_v1.py', 320, 185);
                ctx.fillStyle = '#00ff00'; ctx.font = '22px VT323';
                ctx.fillText('Downloading Claude Code...', 320, 145);
            } else if (type === 'ai') {
                drawFile('random_number_generator_v1.py', 280, 150);
                drawFile('random_number_generator_v2.py', 280, 180);
                drawFile('uv.lock', 280, 210);
                drawFile('pyproject.toml', 280, 240);
            } else if (type === 'leader') {
                drawPC(380, 100);
                drawBoard(args[0]);
                programmer.emotion = args[0]===10 ? 'stressed' : (args[0]===1 ? 'happy' : 'neutral');
            } else if (type === 'loop') {
                drawFile('loop.py', 300, 170);
                ctx.fillStyle = '#00ff00'; ctx.font = '18px VT323';
                ctx.fillText('$ python3 loop.py', 380, 170);
            } else if (type === 'run') {
                drawFile('loop.py', 300, 170);
                ctx.fillStyle = '#00ff00'; ctx.font = '24px VT323';
                ctx.fillText('Running...', 380, 150);
                tokens = Math.min(999, tokens+8);
                ctx.fillText('TOKENS: '+tokens, 380, 190);
            } else if (type === 'recurs') {
                drawFile('loop.py', 300, 150);
                drawFile('recursive_loop.py', 300, 185);
            } else if (type === 'run2') {
                tokens = Math.min(9999, tokens+40);
                ctx.fillStyle = '#00ff00'; ctx.font = '32px VT323';
                ctx.fillText('TOKENS: '+tokens, 350, 160);
                ctx.font = '22px VT323';
                ctx.fillText('Running recursive loop...', 350, 200);
            } else if (type === 'infinite') {
                programmer.emotion = 'happy';
                tokens += Math.floor(Math.random()*60)+20;
                ctx.fillStyle = '#00ff00'; ctx.font = '36px VT323';
                ctx.fillText('TOKENS: '+tokens, 280, 120);
                if (frame%4===0) ctx.fillRect(500+Math.random()*100, 170+Math.random()*50, 6, 6);
            } else if (type === 'game') {
                startGame();
                return;
            }

            if (timer >= dur) { timer = 0; scene++; dialogueArea.style.display = 'none'; }
            requestAnimationFrame(update);
        }

        function startGame() {
            skipBtn.style.display = 'none';
            document.getElementById('cutscene').style.display = 'none';
            dialogueArea.style.display = 'none';
            gameplay.style.display = 'block';
            gameRunning = true;
            tokens = 0;
            obstacles = [];
            player.y = 270;
            player.vy = 0;
            gpLoop();
        }

        function spawn() {
            obstacles.push({x:800, y:288, w:28, h:28, s:5+Math.random()*4});
        }

        function updateGame() {
            frame++; obstacleTimer++;
            if (obstacleTimer > 45+Math.random()*45) { spawn(); obstacleTimer=0; }
            obstacles.forEach(o=>o.x-=o.s);
            obstacles = obstacles.filter(o=>o.x>-50);
            if (!player.grounded) { player.vy += 0.6; player.y += player.vy; }
            if (player.y>=270) { player.y=270; player.vy=0; player.grounded=true; }
            obstacles.forEach(o=>{
                if (player.x<o.x+o.w && player.x+28>o.x && player.y<o.y+o.h && player.y+48>o.y) {
                    gameRunning=false; finalScoreEl.textContent=tokens; gameOver.style.display='flex';
                }
            });
            tokens++; scoreEl.textContent='TOKENS: '+tokens;
        }

        function drawGame() {
            gpCtx.fillStyle='#0a0a0a'; gpCtx.fillRect(0,0,800,360);
            gpCtx.fillStyle='#003300';
            for(let i=0;i<40;i++) gpCtx.fillRect((i*97+frame*0.15)%800,(i*53)%180,2,2);
            gpCtx.fillStyle='#002200'; gpCtx.fillRect(0,328,800,32);
            gpCtx.fillStyle='#00ff00'; gpCtx.fillRect(0,328,800,2);
            // Player
            gpCtx.fillStyle='#00ff00';
            gpCtx.fillRect(player.x+16,player.y+28,24,20);
            gpCtx.fillRect(player.x+12,player.y+48,32,28);
            gpCtx.fillStyle='#88ff88';
            gpCtx.fillRect(player.x+16,player.y+8,24,20);
            gpCtx.fillRect(player.x+14,player.y+10,28,18);
            gpCtx.fillStyle='#006600';
            gpCtx.fillRect(player.x+14,player.y+4,28,8);
            gpCtx.fillStyle='#004400';
            gpCtx.fillRect(player.x+18,player.y+14,4,4);
            gpCtx.fillRect(player.x+30,player.y+14,4,4);
            gpCtx.fillStyle='#00ff00';
            gpCtx.fillRect(player.x,player.y+30,14,8);
            gpCtx.fillRect(player.x+42,player.y+30,14,8);
            gpCtx.fillRect(player.x+14,player.y+76,10,20);
            gpCtx.fillRect(player.x+32,player.y+76,10,20);
            // Obstacles
            obstacles.forEach(o=>{
                gpCtx.fillStyle='#ff0000';
                gpCtx.fillRect(o.x,o.y,o.w,o.h);
                gpCtx.fillStyle='#ffff00';
                gpCtx.fillRect(o.x+4,o.y+4,6,6);
                gpCtx.fillRect(o.x+16,o.y+4,6,6);
            });
        }

        function gpLoop() {
            if(!gameRunning)return;
            updateGame(); drawGame();
            requestAnimationFrame(gpLoop);
        }

        function jump() {
            if(player.grounded && gameRunning) { player.vy=-15; player.grounded=false; }
        }

        skipBtn.onclick = startGame;
        restartBtn.onclick = () => { gameOver.style.display='none'; startGame(); };
        document.addEventListener('keydown', e => { if(e.code==='Space'){e.preventDefault();jump();} });
        document.getElementById('game').onclick = jump;

        update();
    </script>
</body>
</html>
