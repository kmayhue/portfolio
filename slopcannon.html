<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slopcannon.com</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'VT323', monospace;
            overflow: hidden;
        }

        #game-container {
            width: 800px;
        }

        #header {
            background: #00ff00;
            color: #000;
            padding: 8px 16px;
            font-size: 24px;
            text-align: center;
        }

        #game {
            position: relative;
            width: 800px;
            height: 400px;
            background: #0d0d0d;
            border: 4px solid #00ff00;
            overflow: hidden;
        }

        #cutscene, #gameplay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #dialogue-area {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: #000;
            border-top: 3px solid #00ff00;
            padding: 12px 20px;
            display: none;
        }

        #speaker {
            color: #00ff00;
            font-size: 20px;
            margin-bottom: 4px;
        }

        #text {
            color: #fff;
            font-size: 22px;
        }

        #skip-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #00ff00;
            color: #000;
            border: none;
            padding: 8px 16px;
            font-family: 'VT323', monospace;
            font-size: 20px;
            cursor: pointer;
            z-index: 100;
        }

        #skip-btn:hover {
            background: #00cc00;
        }

        #gameplay {
            display: none;
        }

        #score {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #00ff00;
            font-size: 24px;
        }

        #instructions {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #006600;
            font-size: 18px;
        }

        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }

        #game-over h1 {
            color: #ff0000;
            font-size: 48px;
            margin-bottom: 20px;
        }

        #game-over p {
            color: #00ff00;
            font-size: 24px;
            margin-bottom: 30px;
        }

        #restart-btn {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-family: 'VT323', monospace;
            font-size: 24px;
            cursor: pointer;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="header">slopcannon.com</div>
        <div id="game">
            <button id="skip-btn">SKIP >></button>

            <div id="cutscene">
                <canvas id="cs-canvas" width="800" height="370"></canvas>
            </div>

            <div id="dialogue-area">
                <div id="speaker"></div>
                <div id="text"></div>
            </div>

            <div id="gameplay">
                <canvas id="gp-canvas" width="800" height="370"></canvas>
                <div id="score">TOKENS: 0</div>
                <div id="instructions">[SPACE] to jump</div>
            </div>

            <div id="game-over">
                <h1>GAME OVER</h1>
                <p>Final Tokens: <span id="final-score">0</span></p>
                <button id="restart-btn">PLAY AGAIN</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('cs-canvas');
        const ctx = canvas.getContext('2d');
        const gpCanvas = document.getElementById('gp-canvas');
        const gpCtx = gpCanvas.getContext('2d');
        const dialogueArea = document.getElementById('dialogue-area');
        const speakerEl = document.getElementById('speaker');
        const textEl = document.getElementById('text');
        const skipBtn = document.getElementById('skip-btn');
        const cutscene = document.getElementById('cutscene');
        const gameplay = document.getElementById('gameplay');
        const scoreEl = document.getElementById('score');
        const gameOver = document.getElementById('game-over');
        const finalScoreEl = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');

        let frameCount = 0;
        let state = 'intro';
        let subState = 0;
        let dialogueTimer = 0;
        let tokens = 0;
        let gameRunning = false;

        // Characters
        const programmer = { x: -50, y: 250, targetX: 200, state: 'idle', emotion: 'neutral' };
        const boss = { x: 850, y: 240, targetX: 400, state: 'off' };

        // File display
        let files = [];
        let messages = [];

        // Player
        const player = { x: 100, y: 300, vy: 0, grounded: true };
        let obstacles = [];
        let obstacleTimer = 0;

        // Scene definitions
        const scenes = [
            // 0-2: Programmer walks in
            { type: 'walk_in', duration: 120 },
            // 3-5: Boss enters
            { type: 'boss_enter', duration: 60 },
            // 6-8: Think 7
            { type: 'think', text: '7', duration: 90 },
            // 9-11: Boss leaves
            { type: 'boss_leave', duration: 60 },
            // 12-14: Write code
            { type: 'write_code', duration: 120 },
            // 15-17: Send message
            { type: 'message', text: 'I did it!', duration: 90 },
            // 18-20: Boss returns angry
            { type: 'boss_return', duration: 60 },
            // 21: Boss angry dialogue
            { type: 'dialogue', speaker: 'BOSS', text: "You're not using enough tokens!", duration: 2000 },
            // 22-24: Boss leaves
            { type: 'boss_leave', duration: 60 },
            // 25-27: Rename to v1, get Claude
            { type: 'get_claude', duration: 150 },
            // 28-30: AI writes code
            { type: 'ai_code', duration: 150 },
            // 31-33: Click file, message boss
            { type: 'message_ai', text: 'I did it using AI', duration: 90 },
            // 34-36: Boss returns
            { type: 'boss_return', duration: 60 },
            // 37: Boss dialogue
            { type: 'dialogue', speaker: 'BOSS', text: 'Great! Check the dashboard. Don\'t fall behind.', duration: 2500 },
            // 38: Boss leaves
            { type: 'boss_leave', duration: 60 },
            // 39-41: Click dashboard, see last place
            { type: 'leaderboard', place: 10, duration: 120 },
            // 42: Think
            { type: 'think', text: '...', duration: 60 },
            // 43: Dialogue
            { type: 'dialogue', speaker: 'PROGRAMMER', text: 'Claude, get me to first place!', duration: 1500 },
            // 44-46: Write loop.py
            { type: 'write_loop', duration: 120 },
            // 47-49: Run loop.py, walk away
            { type: 'run_loop', duration: 120 },
            // 50-52: Check - 2nd from last
            { type: 'leaderboard', place: 9, duration: 90 },
            // 53-55: Write recursive
            { type: 'write_recursive', duration: 90 },
            // 56-58: Run recursive, walk away
            { type: 'run_recursive', duration: 120 },
            // 59-61: Climbing
            { type: 'leaderboard', place: 7, duration: 60 },
            { type: 'leaderboard', place: 5, duration: 60 },
            { type: 'leaderboard', place: 3, duration: 60 },
            // 62: 1st place!
            { type: 'leaderboard', place: 1, duration: 90 },
            // 63: Win dialogue
            { type: 'dialogue', speaker: 'BOSS', text: "You're doing great! Keep it up!", duration: 2000 },
            // 64: Boss celebrates
            { type: 'boss_celebrate', duration: 90 },
            // 65: Infinite clicking
            { type: 'infinite', duration: 99999 }
        ];

        let currentScene = 0;

        // Drawing functions
        function drawChar(x, y, type, emotion = 'neutral') {
            ctx.fillStyle = '#00ff00';

            if (type === 'programmer') {
                // Head
                ctx.fillRect(x + 20, y, 24, 20);
                // Body
                ctx.fillRect(x + 16, y + 20, 32, 30);
                // Legs
                ctx.fillRect(x + 16, y + 50, 12, 25);
                ctx.fillRect(x + 36, y + 50, 12, 25);
                // Arms
                ctx.fillRect(x, y + 22, 16, 8);
                ctx.fillRect(x + 48, y + 22, 16, 8);

                // Face based on emotion
                ctx.fillStyle = '#0d0d0d';
                if (emotion === 'happy') {
                    ctx.fillRect(x + 24, y + 8, 4, 4);
                    ctx.fillRect(x + 36, y + 8, 4, 4);
                    // Smile
                    ctx.fillRect(x + 26, y + 16, 12, 2);
                } else if (emotion === 'stressed') {
                    ctx.fillRect(x + 22, y + 6, 6, 3);
                    ctx.fillRect(x + 36, y + 6, 6, 3);
                    // Frown
                    ctx.fillRect(x + 26, y + 16, 12, 2);
                } else if (emotion === 'thinking') {
                    ctx.fillRect(x + 24, y + 8, 3, 3);
                    ctx.fillRect(x + 37, y + 8, 3, 3);
                } else {
                    ctx.fillRect(x + 24, y + 8, 4, 4);
                    ctx.fillRect(x + 36, y + 8, 4, 4);
                }
            } else if (type === 'boss') {
                // Head
                ctx.fillRect(x + 20, y, 24, 20);
                // Suit
                ctx.fillRect(x + 12, y + 20, 40, 35);
                // Legs
                ctx.fillRect(x + 16, y + 55, 12, 20);
                ctx.fillRect(x + 36, y + 55, 12, 20);
                // Tie
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(x + 28, y + 22, 8, 16);
                // Face
                ctx.fillStyle = '#0d0d0d';
                ctx.fillRect(x + 24, y + 6, 6, 4);
                ctx.fillRect(x + 34, y + 6, 6, 4);
            }
        }

        function drawComputer(x, y) {
            ctx.fillStyle = '#00ff00';
            // Monitor
            ctx.fillRect(x, y, 80, 50);
            ctx.fillStyle = '#0d0d0d';
            ctx.fillRect(x + 4, y + 4, 72, 42);
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(x + 8, y + 8, 64, 34);
            // Stand
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(x + 32, y + 50, 16, 12);
            ctx.fillRect(x + 20, y + 62, 40, 4);
        }

        function drawFile(name, x, y) {
            ctx.fillStyle = '#00ff00';
            ctx.font = '16px VT323';
            ctx.fillText('📄 ' + name, x, y);
        }

        function drawMessage(text, x, y) {
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(x, y, 150, 40);
            ctx.fillStyle = '#0d0d0d';
            ctx.font = '18px VT323';
            ctx.fillText(text, x + 10, y + 26);
        }

        function drawLeaderboard(place) {
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(250, 50, 300, 250);
            ctx.fillStyle = '#0d0d0d';
            ctx.fillRect(260, 60, 280, 230);

            ctx.font = '24px VT323';
            ctx.fillStyle = '#00ff00';
            ctx.fillText('TOKEN LEADERBOARD', 280, 100);

            const names = ['YOU', 'BOSS', 'JENNY', 'MIKE', 'SARAH', 'TOM', 'LISA', 'JOHN', 'EMMA', 'DAVE'];
            const scores = [place === 1 ? 9999 : (10 - place) * 1000 + 500, 9999, 8500, 7200, 6100, 5500, 4800, 4200, 3500, 2800];

            for (let i = 0; i < 10; i++) {
                const y = 140 + i * 22;
                if (i + 1 === place) {
                    ctx.fillStyle = '#ffff00';
                    ctx.fillText((i + 1) + '. ' + names[i] + '  ' + scores[i], 280, y);
                } else {
                    ctx.fillStyle = '#00ff00';
                    ctx.fillText((i + 1) + '. ' + names[i] + '  ' + scores[i], 280, y);
                }
            }
        }

        function drawTerminal() {
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(0, 0, 800, 370);
            ctx.fillStyle = '#0d0d0d';
            ctx.fillRect(10, 10, 780, 350);

            ctx.fillStyle = '#00ff00';
            ctx.font = '20px VT323';
            ctx.fillText('$', 20, 40);
            ctx.fillRect(35, 30, 400, 2);
        }

        function update() {
            frameCount++;
            ctx.fillStyle = '#0d0d0d';
            ctx.fillRect(0, 0, 800, 370);

            // Floor
            ctx.fillStyle = '#002200';
            ctx.fillRect(0, 340, 800, 30);
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(0, 340, 800, 2);

            // Process current scene
            const scene = scenes[currentScene];

            if (scene.type === 'walk_in') {
                programmer.x += 4;
                if (programmer.x >= programmer.targetX) {
                    programmer.x = programmer.targetX;
                    currentScene++;
                }
                drawChar(programmer.x, programmer.y, 'programmer');
                drawComputer(500, 250);

            } else if (scene.type === 'boss_enter') {
                boss.x -= 5;
                if (boss.x <= boss.targetX) {
                    boss.x = boss.targetX;
                    currentScene++;
                }
                drawChar(programmer.x, programmer.y, 'programmer');
                drawComputer(500, 250);
                drawChar(boss.x, boss.y, 'boss');

            } else if (scene.type === 'think') {
                programmer.emotion = 'thinking';
                drawChar(programmer.x, programmer.y, 'programmer', 'thinking');
                drawComputer(500, 250);
                drawChar(boss.x, boss.y, 'boss');

                ctx.fillStyle = '#00ff00';
                ctx.font = '28px VT323';
                ctx.fillText(scene.text, programmer.x + 60, programmer.y - 20);

            } else if (scene.type === 'boss_leave') {
                boss.x += 6;
                drawChar(programmer.x, programmer.y, 'programmer', 'stressed');
                drawComputer(500, 250);
                if (boss.x > 850) {
                    boss.state = 'off';
                    currentScene++;
                }

            } else if (scene.type === 'write_code') {
                drawChar(programmer.x, programmer.y, 'programmer', 'happy');
                drawComputer(500, 250);
                drawFile('random_number_generator/', 300, 180);
                drawFile('random_number_generator.py', 300, 210);

            } else if (scene.type === 'message') {
                drawChar(programmer.x, programmer.y, 'programmer', 'happy');
                drawComputer(500, 250);
                drawFile('random_number_generator/', 300, 180);
                drawFile('random_number_generator.py', 300, 210);
                drawMessage(scene.text, 450, 150);

            } else if (scene.type === 'boss_return') {
                boss.x -= 5;
                if (boss.x <= boss.targetX) {
                    boss.x = boss.targetX;
                    currentScene++;
                }
                drawChar(programmer.x, programmer.y, 'programmer', 'stressed');
                drawComputer(500, 250);
                drawFile('random_number_generator/', 300, 180);
                drawFile('random_number_generator.py', 300, 210);
                drawChar(boss.x, boss.y, 'boss');

            } else if (scene.type === 'dialogue') {
                dialogueArea.style.display = 'block';
                speakerEl.textContent = scene.speaker;
                textEl.textContent = scene.text;

                drawChar(programmer.x, programmer.y, 'programmer', scene.speaker === 'BOSS' ? 'stressed' : 'happy');
                drawComputer(500, 250);
                drawChar(boss.x, boss.y, 'boss');

                dialogueTimer += 16;
                if (dialogueTimer > scene.duration) {
                    dialogueTimer = 0;
                    currentScene++;
                    if (scene.speaker === 'BOSS' && scene.text.includes('dashboard')) {
                        setTimeout(() => dialogueArea.style.display = 'none', 500);
                    }
                }

            } else if (scene.type === 'get_claude') {
                programmer.emotion = 'neutral';
                drawChar(programmer.x, programmer.y, 'programmer');
                drawComputer(500, 250);
                drawFile('random_number_generator_v1.py', 300, 210);

                ctx.fillStyle = '#00ff00';
                ctx.font = '20px VT323';
                ctx.fillText('Downloading Claude Code...', 300, 160);

            } else if (scene.type === 'ai_code') {
                drawChar(programmer.x, programmer.y, 'programmer');
                drawComputer(500, 250);
                drawFile('random_number_generator_v1.py', 260, 180);
                drawFile('random_number_generator_v2.py', 260, 210);
                drawFile('uv.lock', 260, 240);
                drawFile('pyproject.toml', 260, 270);

            } else if (scene.type === 'message_ai') {
                drawChar(programmer.x, programmer.y, 'programmer', 'happy');
                drawComputer(500, 250);
                drawFile('random_number_generator_v2.py', 260, 210);
                drawMessage(scene.text, 450, 150);

            } else if (scene.type === 'leaderboard') {
                drawChar(programmer.x, programmer.y, 'programmer');
                drawComputer(400, 150);
                drawLeaderboard(scene.place);

                if (scene.place === 10) {
                    programmer.emotion = 'stressed';
                } else if (scene.place === 1) {
                    programmer.emotion = 'happy';
                }

            } else if (scene.type === 'write_loop') {
                drawChar(programmer.x, programmer.y, 'programmer');
                drawComputer(500, 250);
                drawFile('loop.py', 280, 200);
                ctx.fillStyle = '#00ff00';
                ctx.font = '16px VT323';
                ctx.fillText('$ python3 loop.py', 350, 200);

            } else if (scene.type === 'run_loop') {
                drawChar(programmer.x, programmer.y, 'programmer');
                drawComputer(500, 250);
                drawFile('loop.py', 280, 200);

                ctx.fillStyle = '#00ff00';
                ctx.font = '20px VT323';
                ctx.fillText('Running...', 350, 180);

                // Tokens going up
                tokens += 10;
                ctx.font = '28px VT323';
                ctx.fillText('TOKENS: ' + tokens, 350, 220);

            } else if (scene.type === 'write_recursive') {
                drawChar(programmer.x, programmer.y, 'programmer');
                drawComputer(500, 250);
                drawFile('loop.py', 280, 180);
                drawFile('recursive_loop.py', 280, 210);

            } else if (scene.type === 'run_recursive') {
                drawChar(programmer.x, programmer.y, 'programmer');
                drawComputer(500, 250);

                tokens += 50;
                ctx.fillStyle = '#00ff00';
                ctx.font = '28px VT323';
                ctx.fillText('TOKENS: ' + tokens, 350, 200);
                ctx.font = '20px VT323';
                ctx.fillText('Running recursive loop...', 350, 240);

            } else if (scene.type === 'boss_celebrate') {
                programmer.emotion = 'happy';
                drawChar(programmer.x, programmer.y, 'programmer', 'happy');
                drawComputer(500, 250);
                drawChar(boss.x, boss.y, 'boss');

                // Bounce boss
                boss.y = 240 + Math.sin(frameCount * 0.3) * 10;

            } else if (scene.type === 'infinite') {
                drawChar(programmer.x, programmer.y, 'programmer', 'happy');
                drawComputer(500, 250);

                tokens += Math.floor(Math.random() * 100) + 10;

                ctx.fillStyle = '#00ff00';
                ctx.font = '32px VT323';
                ctx.fillText('TOKENS: ' + tokens, 300, 150);

                // Click effect
                if (frameCount % 10 === 0) {
                    ctx.fillStyle = '#00ff00';
                    ctx.fillRect(450 + Math.random() * 100, 200 + Math.random() * 50, 4, 4);
                }

                if (frameCount > 180) {
                    // Move to game
                    setTimeout(startGame, 1000);
                    return;
                }
            }

            requestAnimationFrame(update);
        }

        // Gameplay
        function startGame() {
            cutscene.style.display = 'none';
            gameplay.style.display = 'block';
            gameRunning = true;
            tokens = 0;
            obstacles = [];
            player.y = 300;
            player.vy = 0;
            gpLoop();
        }

        function spawnObstacle() {
            obstacles.push({
                x: 800,
                y: 312,
                width: 24,
                height: 24,
                speed: 4 + Math.random() * 3
            });
        }

        function updateGame() {
            frameCount++;
            obstacleTimer++;

            if (obstacleTimer > 60 + Math.random() * 60) {
                spawnObstacle();
                obstacleTimer = 0;
            }

            obstacles.forEach(obs => obs.x -= obs.speed);
            obstacles = obstacles.filter(obs => obs.x > -50);

            if (!player.grounded) {
                player.vy += 0.5;
                player.y += player.vy;
            }

            if (player.y >= 300) {
                player.y = 300;
                player.vy = 0;
                player.grounded = true;
            }

            obstacles.forEach(obs => {
                if (player.x < obs.x + obs.width && player.x + 32 > obs.x &&
                    player.y < obs.y + obs.height && player.y + 48 > obs.y) {
                    gameRunning = false;
                    finalScoreEl.textContent = tokens;
                    gameOver.style.display = 'flex';
                }
            });

            tokens++;
            scoreEl.textContent = 'TOKENS: ' + tokens;
        }

        function drawGame() {
            gpCtx.fillStyle = '#0d0d0d';
            gpCtx.fillRect(0, 0, 800, 370);

            // Stars
            gpCtx.fillStyle = '#004400';
            for (let i = 0; i < 30; i++) {
                gpCtx.fillRect((i * 73 + frameCount * 0.1) % 800, (i * 37) % 200, 2, 2);
            }

            // Floor
            gpCtx.fillStyle = '#002200';
            gpCtx.fillRect(0, 348, 800, 22);
            gpCtx.fillStyle = '#00ff00';
            gpCtx.fillRect(0, 348, 800, 2);

            // Player
            drawCharGP(player.x, player.y, 'programmer');

            // Obstacles
            obstacles.forEach(obs => {
                gpCtx.fillStyle = '#ff0000';
                gpCtx.fillRect(obs.x, obs.y, obs.width, obs.height);
                // Eyes
                gpCtx.fillStyle = '#ffff00';
                gpCtx.fillRect(obs.x + 4, obs.y + 4, 4, 4);
                gpCtx.fillRect(obs.x + 14, obs.y + 4, 4, 4);
            });
        }

        function drawCharGP(x, y, type) {
            gpCtx.fillStyle = '#00ff00';
            gpCtx.fillRect(x + 20, y, 24, 20);
            gpCtx.fillRect(x + 16, y + 20, 32, 28);
            gpCtx.fillRect(x + 16, y + 48, 12, 24);
            gpCtx.fillRect(x + 36, y + 48, 12, 24);
            gpCtx.fillRect(x, y + 22, 16, 8);
            gpCtx.fillRect(x + 48, y + 22, 16, 8);

            gpCtx.fillStyle = '#0d0d0d';
            gpCtx.fillRect(x + 24, y + 6, 4, 4);
            gpCtx.fillRect(x + 36, y + 6, 4, 4);
        }

        function gpLoop() {
            if (!gameRunning) return;
            updateGame();
            drawGame();
            requestAnimationFrame(gpLoop);
        }

        function jump() {
            if (player.grounded && gameRunning) {
                player.vy = -14;
                player.grounded = false;
            }
        }

        // Events
        skipBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', () => {
            gameOver.style.display = 'none';
            startGame();
        });

        document.addEventListener('keydown', e => {
            if (e.code === 'Space') {
                e.preventDefault();
                jump();
            }
        });

        document.getElementById('game').addEventListener('click', jump);

        // Start
        update();
    </script>
</body>
</html>
