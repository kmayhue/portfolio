<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slopcannon.com</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'VT323', monospace;
            overflow: hidden;
        }

        #game-container { width: 800px; }

        #header {
            background: #00ff00;
            color: #000;
            padding: 8px 16px;
            font-size: 24px;
            text-align: center;
        }

        #game {
            position: relative;
            width: 800px;
            height: 440px;
            background: #0d0d0d;
            border: 4px solid #00ff00;
            overflow: hidden;
        }

        #cutscene, #gameplay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 360px;
        }

        #dialogue-area {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: #000;
            border-top: 3px solid #00ff00;
            padding: 10px 20px;
            display: none;
        }

        #speaker { color: #00ff00; font-size: 20px; margin-bottom: 4px; }
        #text { color: #fff; font-size: 22px; }

        #skip-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #00ff00;
            color: #000;
            border: none;
            padding: 8px 16px;
            font-family: 'VT323', monospace;
            font-size: 20px;
            cursor: pointer;
            z-index: 100;
        }

        #skip-btn:hover { background: #00cc00; }

        #gameplay { display: none; }

        #score {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #00ff00;
            font-size: 24px;
            z-index: 10;
        }

        #instructions {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #006600;
            font-size: 18px;
            z-index: 10;
        }

        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }

        #game-over h1 { color: #ff0000; font-size: 48px; margin-bottom: 20px; }
        #game-over p { color: #00ff00; font-size: 24px; margin-bottom: 30px; }

        #restart-btn {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-family: 'VT323', monospace;
            font-size: 24px;
            cursor: pointer;
        }

        canvas { display: block; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="header">slopcannon.com</div>
        <div id="game">
            <button id="skip-btn">SKIP >></button>

            <div id="cutscene">
                <canvas id="cs-canvas" width="800" height="360"></canvas>
            </div>

            <div id="dialogue-area">
                <div id="speaker"></div>
                <div id="text"></div>
            </div>

            <div id="gameplay">
                <canvas id="gp-canvas" width="800" height="360"></canvas>
                <div id="score">TOKENS: 0</div>
                <div id="instructions">[SPACE] to jump</div>
            </div>

            <div id="game-over">
                <h1>GAME OVER</h1>
                <p>Final Tokens: <span id="final-score">0</span></p>
                <button id="restart-btn">PLAY AGAIN</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('cs-canvas');
        const ctx = canvas.getContext('2d');
        const gpCanvas = document.getElementById('gp-canvas');
        const gpCtx = gpCanvas.getContext('2d');
        const dialogueArea = document.getElementById('dialogue-area');
        const speakerEl = document.getElementById('speaker');
        const textEl = document.getElementById('text');
        const skipBtn = document.getElementById('skip-btn');
        const cutscene = document.getElementById('cutscene');
        const gameplay = document.getElementById('gameplay');
        const scoreEl = document.getElementById('score');
        const gameOver = document.getElementById('game-over');
        const finalScoreEl = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');

        let frameCount = 0;
        let currentScene = 0;
        let sceneTimer = 0;
        let tokens = 0;
        let gameRunning = false;

        const programmer = { x: -50, y: 250, targetX: 200, emotion: 'neutral' };
        const boss = { x: 850, y: 240, targetX: 400 };
        const player = { x: 100, y: 280, vy: 0, grounded: true };
        let obstacles = [];
        let obstacleTimer = 0;

        const scenes = [
            { type: 'walk_in', duration: 90 },
            { type: 'boss_enter', duration: 60 },
            { type: 'think', speaker: 'BOSS', text: 'Think of a number between 1 and 10', duration: 1800 },
            { type: 'think', speaker: 'PROGRAMMER', text: '7', duration: 1200 },
            { type: 'think', speaker: 'BOSS', text: 'Great. Now automate that.', duration: 1800 },
            { type: 'boss_leave', duration: 50 },
            { type: 'write_code', duration: 100 },
            { type: 'message', text: 'I did it!', duration: 80 },
            { type: 'boss_return', duration: 50 },
            { type: 'dialogue', speaker: 'BOSS', text: "You're not using enough tokens!", duration: 2000 },
            { type: 'boss_leave', duration: 50 },
            { type: 'get_claude', duration: 100 },
            { type: 'ai_code', duration: 100 },
            { type: 'message', text: 'I did it using AI', duration: 80 },
            { type: 'boss_return', duration: 50 },
            { type: 'dialogue', speaker: 'BOSS', text: "Great! Check the dashboard. Don't fall behind.", duration: 2500 },
            { type: 'boss_leave', duration: 50 },
            { type: 'leaderboard', place: 10, duration: 100 },
            { type: 'think', speaker: 'PROGRAMMER', text: 'Claude, get me to first place!', duration: 1500 },
            { type: 'write_loop', duration: 80 },
            { type: 'run_loop', duration: 100 },
            { type: 'leaderboard', place: 9, duration: 60 },
            { type: 'write_recursive', duration: 60 },
            { type: 'run_recursive', duration: 80 },
            { type: 'leaderboard', place: 7, duration: 40 },
            { type: 'leaderboard', place: 5, duration: 40 },
            { type: 'leaderboard', place: 3, duration: 40 },
            { type: 'leaderboard', place: 1, duration: 80 },
            { type: 'dialogue', speaker: 'BOSS', text: "You're doing great! Keep it up!", duration: 2000 },
            { type: 'boss_celebrate', duration: 60 },
            { type: 'infinite', duration: 180 }
        ];

        function drawChar(x, y, type, emotion = 'neutral') {
            ctx.fillStyle = '#00ff00';
            if (type === 'programmer') {
                ctx.fillRect(x + 20, y, 24, 20);
                ctx.fillRect(x + 16, y + 20, 32, 30);
                ctx.fillRect(x + 16, y + 50, 12, 25);
                ctx.fillRect(x + 36, y + 50, 12, 25);
                ctx.fillRect(x, y + 22, 16, 8);
                ctx.fillRect(x + 48, y + 22, 16, 8);
                ctx.fillStyle = '#0d0d0d';
                if (emotion === 'happy') {
                    ctx.fillRect(x + 24, y + 8, 4, 4);
                    ctx.fillRect(x + 36, y + 8, 4, 4);
                    ctx.fillRect(x + 26, y + 16, 12, 2);
                } else if (emotion === 'stressed') {
                    ctx.fillRect(x + 22, y + 6, 6, 3);
                    ctx.fillRect(x + 36, y + 6, 6, 3);
                    ctx.fillRect(x + 26, y + 16, 12, 2);
                } else if (emotion === 'thinking') {
                    ctx.fillRect(x + 24, y + 8, 3, 3);
                    ctx.fillRect(x + 37, y + 8, 3, 3);
                } else {
                    ctx.fillRect(x + 24, y + 8, 4, 4);
                    ctx.fillRect(x + 36, y + 8, 4, 4);
                }
            } else if (type === 'boss') {
                ctx.fillStyle = '#00ff00';
                ctx.fillRect(x + 20, y, 24, 20);
                ctx.fillRect(x + 12, y + 20, 40, 35);
                ctx.fillRect(x + 16, y + 55, 12, 20);
                ctx.fillRect(x + 36, y + 55, 12, 20);
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(x + 28, y + 22, 8, 16);
                ctx.fillStyle = '#0d0d0d';
                ctx.fillRect(x + 24, y + 6, 6, 4);
                ctx.fillRect(x + 34, y + 6, 6, 4);
            }
        }

        function drawComputer(x, y) {
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(x, y, 80, 50);
            ctx.fillStyle = '#0d0d0d';
            ctx.fillRect(x + 4, y + 4, 72, 42);
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(x + 8, y + 8, 64, 34);
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(x + 32, y + 50, 16, 12);
            ctx.fillRect(x + 20, y + 62, 40, 4);
        }

        function drawFile(name, x, y) {
            ctx.fillStyle = '#00ff00';
            ctx.font = '16px VT323';
            ctx.fillText(name, x, y);
        }

        function drawMessage(text, x, y) {
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(x, y, 180, 45);
            ctx.fillStyle = '#0d0d0d';
            ctx.font = '18px VT323';
            ctx.fillText(text, x + 10, y + 28);
        }

        function drawLeaderboard(place) {
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(250, 30, 300, 280);
            ctx.fillStyle = '#0d0d0d';
            ctx.fillRect(260, 40, 280, 260);
            ctx.font = '24px VT323';
            ctx.fillText('TOKEN LEADERBOARD', 280, 80);
            const names = ['YOU', 'BOSS', 'JENNY', 'MIKE', 'SARAH', 'TOM', 'LISA', 'JOHN', 'EMMA', 'DAVE'];
            const scores = [place === 1 ? 9999 : (10 - place) * 1000 + 500, 9999, 8500, 7200, 6100, 5500, 4800, 4200, 3500, 2800];
            for (let i = 0; i < 10; i++) {
                ctx.fillStyle = (i + 1) === place ? '#ffff00' : '#00ff00';
                ctx.fillText((i + 1) + '. ' + names[i] + '  ' + scores[i], 280, 115 + i * 22);
            }
        }

        function update() {
            frameCount++;
            ctx.fillStyle = '#0d0d0d';
            ctx.fillRect(0, 0, 800, 360);
            ctx.fillStyle = '#002200';
            ctx.fillRect(0, 330, 800, 30);
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(0, 330, 800, 2);

            if (currentScene >= scenes.length) {
                startGame();
                return;
            }

            const scene = scenes[currentScene];
            sceneTimer++;

            const sceneFrames = scene.duration / 16;

            // Always draw programmer and computer
            drawComputer(500, 250);
            drawChar(programmer.x, programmer.y, 'programmer', programmer.emotion);

            if (scene.type === 'walk_in') {
                programmer.x += 5;
                if (programmer.x >= programmer.targetX) programmer.x = programmer.targetX;
            } else if (scene.type === 'boss_enter') {
                boss.x -= 6;
                drawChar(boss.x, boss.y, 'boss');
            } else if (scene.type === 'think' || scene.type === 'dialogue') {
                dialogueArea.style.display = 'block';
                speakerEl.textContent = scene.speaker || '';
                textEl.textContent = scene.text;
                if (scene.speaker === 'BOSS') {
                    drawChar(boss.x, boss.y, 'boss');
                    programmer.emotion = 'stressed';
                } else {
                    programmer.emotion = 'thinking';
                }
                if (scene.type === 'think' && scene.text.includes('7')) {
                    ctx.fillStyle = '#00ff00';
                    ctx.font = '28px VT323';
                    ctx.fillText('7', programmer.x + 60, programmer.y - 20);
                }
            } else if (scene.type === 'boss_leave') {
                boss.x += 6;
                programmer.emotion = 'stressed';
                if (boss.x > 850) boss.x = 850;
            } else if (scene.type === 'write_code') {
                drawFile('random_number_generator/', 300, 170);
                drawFile('random_number_generator.py', 300, 200);
            } else if (scene.type === 'message') {
                drawFile('random_number_generator.py', 300, 200);
                drawMessage(scene.text, 450, 140);
                programmer.emotion = 'happy';
            } else if (scene.type === 'boss_return') {
                boss.x -= 6;
                if (boss.x <= boss.targetX) boss.x = boss.targetX;
                drawChar(boss.x, boss.y, 'boss');
                programmer.emotion = 'stressed';
            } else if (scene.type === 'get_claude') {
                drawFile('random_number_generator_v1.py', 300, 200);
                ctx.fillStyle = '#00ff00';
                ctx.font = '20px VT323';
                ctx.fillText('Downloading Claude Code...', 300, 150);
            } else if (scene.type === 'ai_code') {
                drawFile('random_number_generator_v1.py', 260, 170);
                drawFile('random_number_generator_v2.py', 260, 200);
                drawFile('uv.lock', 260, 230);
                drawFile('pyproject.toml', 260, 260);
            } else if (scene.type === 'leaderboard') {
                drawComputer(400, 130);
                drawLeaderboard(scene.place);
                programmer.emotion = scene.place === 10 ? 'stressed' : (scene.place === 1 ? 'happy' : 'neutral');
            } else if (scene.type === 'write_loop') {
                drawFile('loop.py', 280, 190);
                ctx.fillStyle = '#00ff00';
                ctx.font = '16px VT323';
                ctx.fillText('$ python3 loop.py', 350, 190);
            } else if (scene.type === 'run_loop') {
                drawFile('loop.py', 280, 190);
                ctx.fillStyle = '#00ff00';
                ctx.font = '20px VT323';
                ctx.fillText('Running...', 350, 170);
                tokens = Math.min(999, tokens + 5);
                ctx.fillText('TOKENS: ' + tokens, 350, 210);
            } else if (scene.type === 'write_recursive') {
                drawFile('loop.py', 280, 170);
                drawFile('recursive_loop.py', 280, 200);
            } else if (scene.type === 'run_recursive') {
                tokens = Math.min(9999, tokens + 30);
                ctx.fillStyle = '#00ff00';
                ctx.font = '28px VT323';
                ctx.fillText('TOKENS: ' + tokens, 350, 180);
                ctx.font = '20px VT323';
                ctx.fillText('Running recursive loop...', 350, 220);
            } else if (scene.type === 'boss_celebrate') {
                drawChar(boss.x, boss.y + Math.sin(frameCount * 0.2) * 5, 'boss');
                programmer.emotion = 'happy';
            } else if (scene.type === 'infinite') {
                programmer.emotion = 'happy';
                tokens += Math.floor(Math.random() * 50) + 20;
                ctx.fillStyle = '#00ff00';
                ctx.font = '32px VT323';
                ctx.fillText('TOKENS: ' + tokens, 300, 130);
                if (frameCount % 5 === 0) {
                    ctx.fillRect(480 + Math.random() * 80, 180 + Math.random() * 40, 4, 4);
                }
            }

            // Check if scene is done
            if (sceneTimer > sceneFrames) {
                sceneTimer = 0;
                currentScene++;
                if (scene.type !== 'dialogue' && scene.type !== 'think') {
                    dialogueArea.style.display = 'none';
                }
                if (scene.type === 'dialogue') {
                    dialogueArea.style.display = 'none';
                }
            }

            requestAnimationFrame(update);
        }

        function startGame() {
            cutscene.style.display = 'none';
            dialogueArea.style.display = 'none';
            gameplay.style.display = 'block';
            gameRunning = true;
            tokens = 0;
            obstacles = [];
            player.y = 280;
            player.vy = 0;
            gpLoop();
        }

        function spawnObstacle() {
            obstacles.push({ x: 800, y: 296, width: 24, height: 24, speed: 4 + Math.random() * 3 });
        }

        function updateGame() {
            frameCount++;
            obstacleTimer++;

            if (obstacleTimer > 50 + Math.random() * 50) {
                spawnObstacle();
                obstacleTimer = 0;
            }

            obstacles.forEach(obs => obs.x -= obs.speed);
            obstacles = obstacles.filter(obs => obs.x > -50);

            if (!player.grounded) {
                player.vy += 0.6;
                player.y += player.vy;
            }

            if (player.y >= 280) {
                player.y = 280;
                player.vy = 0;
                player.grounded = true;
            }

            obstacles.forEach(obs => {
                if (player.x < obs.x + obs.width && player.x + 28 > obs.x &&
                    player.y < obs.y + obs.height && player.y + 48 > obs.y) {
                    gameRunning = false;
                    finalScoreEl.textContent = tokens;
                    gameOver.style.display = 'flex';
                }
            });

            tokens++;
            scoreEl.textContent = 'TOKENS: ' + tokens;
        }

        function drawGame() {
            gpCtx.fillStyle = '#0d0d0d';
            gpCtx.fillRect(0, 0, 800, 360);
            gpCtx.fillStyle = '#004400';
            for (let i = 0; i < 30; i++) {
                gpCtx.fillRect((i * 73 + frameCount * 0.1) % 800, (i * 37) % 180, 2, 2);
            }
            gpCtx.fillStyle = '#002200';
            gpCtx.fillRect(0, 328, 800, 32);
            gpCtx.fillStyle = '#00ff00';
            gpCtx.fillRect(0, 328, 800, 2);

            // Player
            gpCtx.fillStyle = '#00ff00';
            gpCtx.fillRect(player.x + 20, player.y, 24, 20);
            gpCtx.fillRect(player.x + 16, player.y + 20, 32, 28);
            gpCtx.fillRect(player.x + 16, player.y + 48, 12, 24);
            gpCtx.fillRect(player.x + 36, player.y + 48, 12, 24);
            gpCtx.fillRect(player.x, player.y + 22, 16, 8);
            gpCtx.fillRect(player.x + 48, player.y + 22, 16, 8);
            gpCtx.fillStyle = '#0d0d0d';
            gpCtx.fillRect(player.x + 24, player.y + 6, 4, 4);
            gpCtx.fillRect(player.x + 36, player.y + 6, 4, 4);

            // Obstacles
            obstacles.forEach(obs => {
                gpCtx.fillStyle = '#ff0000';
                gpCtx.fillRect(obs.x, obs.y, obs.width, obs.height);
                gpCtx.fillStyle = '#ffff00';
                gpCtx.fillRect(obs.x + 4, obs.y + 4, 4, 4);
                gpCtx.fillRect(obs.x + 14, obs.y + 4, 4, 4);
            });
        }

        function gpLoop() {
            if (!gameRunning) return;
            updateGame();
            drawGame();
            requestAnimationFrame(gpLoop);
        }

        function jump() {
            if (player.grounded && gameRunning) {
                player.vy = -14;
                player.grounded = false;
            }
        }

        skipBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', () => {
            gameOver.style.display = 'none';
            startGame();
        });

        document.addEventListener('keydown', e => {
            if (e.code === 'Space') {
                e.preventDefault();
                jump();
            }
        });

        document.getElementById('game').addEventListener('click', jump);

        update();
    </script>
</body>
</html>
