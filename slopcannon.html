<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slopcannon.com</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'VT323', monospace; overflow: hidden; }
        #header { background: #00ff00; color: #000; padding: 8px 16px; font-size: 28px; text-align: center; letter-spacing: 4px; }
        #game { position: relative; width: 800px; height: 450px; background: #0a0a0a; border: 4px solid #00ff00; border-top: none; }
        #game canvas { position: absolute; top: 0; left: 0; }
        #cutscene { position: absolute; top: 0; left: 0; width: 100%; height: 360px; }
        #dialogue { position: absolute; bottom: 0; left: 0; right: 0; height: 90px; background: #000; border-top: 3px solid #00ff00; padding: 12px 24px; display: none; }
        #speaker { color: #00ff00; font-size: 22px; margin-bottom: 6px; }
        #text { color: #fff; font-size: 24px; }
        #skip-btn { position: absolute; top: 10px; right: 10px; background: transparent; color: #00ff00; border: 2px solid #00ff00; padding: 8px 16px; font-family: 'VT323', monospace; font-size: 18px; cursor: pointer; z-index: 100; }
        #gameplay { display: none; }
        #score { position: absolute; top: 10px; right: 10px; color: #00ff00; font-size: 28px; z-index: 10; }
        #instructions { position: absolute; bottom: 10px; left: 10px; color: #004400; font-size: 20px; z-index: 10; }
        #game-over { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 50; }
        #game-over h1 { color: #ff0000; font-size: 56px; margin-bottom: 20px; }
        #game-over p { color: #00ff00; font-size: 28px; margin-bottom: 40px; }
        #restart-btn { background: #00ff00; color: #000; border: none; padding: 20px 40px; font-family: 'VT323', monospace; font-size: 24px; cursor: pointer; }
    </style>
</head>
<body>
    <div style="width:800px">
        <div id="header">slopcannon.com</div>
        <div id="game">
            <button id="skip-btn">SKIP >></button>
            <canvas id="cs-canvas" width="800" height="360"></canvas>
            <canvas id="gp-canvas" width="800" height="360"></canvas>
            <div id="dialogue"><div id="speaker"></div><div id="text"></div></div>
            <div id="score">TOKENS: 0</div>
            <div id="instructions">[SPACE] to jump</div>
            <div id="game-over"><h1>GAME OVER</h1><p>Final Tokens: <span id="final-score">0</span></p><button id="restart-btn">PLAY AGAIN</button></div>
        </div>
    </div>

    <script>
        const csCanvas = document.getElementById('cs-canvas');
        const csCtx = csCanvas.getContext('2d');
        const gpCanvas = document.getElementById('gp-canvas');
        const gpCtx = gpCanvas.getContext('2d');
        const dialogue = document.getElementById('dialogue');
        const speaker = document.getElementById('speaker');
        const text = document.getElementById('text');

        let scene = 0, timer = 0, tokens = 0, running = true;
        const programmer = { x: 50, y: 230 };
        const boss = { x: 700, y: 220 };
        const player = { x: 80, y: 270, vy: 0, grounded: true };
        let obstacles = [], obstacleTimer = 0;

        const story = [
            ['walk', 200], ['boss_in', 100], ['dlog', 'BOSS', 'Think of a number 1-10', 200],
            ['dlog', 'PROGRAMMER', '7', 150], ['dlog', 'BOSS', 'Great. Automate it.', 200],
            ['boss_out', 80], ['sit', 30], ['code', 150], ['msg', 120],
            ['boss_in', 80], ['dlog', 'BOSS', "Not enough tokens!", 200],
            ['boss_out', 80], ['claude', 150], ['ai', 150], ['msg', 100],
            ['boss_in', 80], ['dlog', 'BOSS', "Great! Check dashboard.", 250],
            ['boss_out', 80], ['leader', 10, 150],
            ['dlog', 'PROGRAMMER', 'Claude, get me to first!', 150],
            ['loop', 120], ['run', 150], ['leader', 9, 80],
            ['recurs', 100], ['run2', 120], ['leader', 7, 60], ['leader', 5, 60], ['leader', 3, 60],
            ['leader', 1, 100], ['dlog', 'BOSS', "You're doing great!", 200],
            ['celebrate', 100], ['infinite', 200], ['game', 1]
        ];

        function drawChar(ctx, x, y, color, emo) {
            ctx.fillStyle = color;
            // Body
            ctx.fillRect(x+16, y+28, 24, 20);
            ctx.fillRect(x+12, y+48, 32, 28);
            // Head
            ctx.fillStyle = '#88ff88';
            ctx.fillRect(x+16, y+8, 24, 20);
            ctx.fillStyle = '#006600';
            ctx.fillRect(x+14, y+4, 28, 8);
            // Face
            ctx.fillStyle = '#004400';
            if (emo === 'happy') {
                ctx.fillRect(x+18, y+14, 4, 4);
                ctx.fillRect(x+30, y+14, 4, 4);
                ctx.fillRect(x+20, y+22, 16, 2);
            } else if (emo === 'stressed') {
                ctx.fillRect(x+16, y+12, 6, 3);
                ctx.fillRect(x+30, y+12, 6, 3);
                ctx.fillRect(x+20, y+24, 16, 2);
            } else {
                ctx.fillRect(x+18, y+14, 4, 4);
                ctx.fillRect(x+30, y+14, 4, 4);
            }
            // Arms
            ctx.fillStyle = color;
            ctx.fillRect(x, y+30, 14, 8);
            ctx.fillRect(x+42, y+30, 14, 8);
            // Legs
            ctx.fillRect(x+14, y+76, 10, 20);
            ctx.fillRect(x+32, y+76, 10, 20);
            // Glasses
            ctx.fillStyle = '#004400';
            ctx.fillRect(x+16, y+14, 26, 2);
        }

        function drawDesk(ctx, x, y) {
            ctx.fillStyle = '#006600';
            ctx.fillRect(x-30, y+30, 25, 45);
            ctx.fillRect(x-30, y+70, 25, 8);
            ctx.fillStyle = '#004400';
            ctx.fillRect(x-20, y+75, 140, 6);
            ctx.fillRect(x-10, y+81, 10, 35);
            ctx.fillRect(x+70, y+81, 10, 35);
        }

        function drawPC(ctx, x, y) {
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(x, y, 80, 55);
            ctx.fillStyle = '#001100';
            ctx.fillRect(x+3, y+3, 74, 49);
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(x+6, y+6, 68, 43);
            ctx.fillStyle = '#003300';
            ctx.fillRect(x+32, y+55, 16, 12);
            ctx.fillRect(x+20, y+67, 40, 3);
            ctx.fillStyle = '#004400';
            ctx.fillRect(x+10, y+78, 60, 5);
        }

        function drawBossChar(ctx, x, y) {
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(x+12, y+28, 32, 24);
            ctx.fillRect(x+8, y+52, 40, 24);
            ctx.fillStyle = '#88ff88';
            ctx.fillRect(x+14, y+6, 28, 22);
            ctx.fillStyle = '#004400';
            ctx.fillRect(x+12, y, 32, 8);
            ctx.fillRect(x+16, y+12, 6, 4);
            ctx.fillRect(x+34, y+12, 6, 4);
            ctx.fillStyle = '#00aa00';
            ctx.fillRect(x+20, y+30, 16, 20);
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(x+24, y+32, 8, 14);
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(x+12, y+76, 12, 18);
            ctx.fillRect(x+32, y+76, 12, 18);
        }

        function drawScreen(ctx, files) {
            const sx = 306, sy = 186;
            ctx.save();
            ctx.beginPath();
            ctx.rect(sx, sy, 68, 43);
            ctx.clip();
            ctx.fillStyle = '#00ff00';
            ctx.font = '10px VT323';
            let yy = sy + 12;
            files.forEach(f => { ctx.fillText(f, sx+4, yy); yy += 12; });
            ctx.restore();
        }

        function update() {
            if (!running) return;

            csCtx.fillStyle = '#0a0a0a';
            csCtx.fillRect(0, 0, 800, 360);
            
            // Stars
            csCtx.fillStyle = '#003300';
            for (let i = 0; i < 40; i++) csCtx.fillRect((i * 97 + scene * 0.2) % 800, (i * 53) % 200, 2, 2);
            
            // Floor
            csCtx.fillStyle = '#002200';
            csCtx.fillRect(0, 330, 800, 30);
            csCtx.fillStyle = '#00ff00';
            csCtx.fillRect(0, 330, 800, 2);

            // Draw desk and PC
            drawDesk(csCtx, 250, 180);
            drawPC(csCtx, 300, 180);

            if (scene >= story.length) { startGame(); return; }

            const [type, ...args] = story[scene];
            timer++;

            // Always draw programmer
            const sitting = story.slice(0, scene+1).some(s => s[0] === 'sit');
            drawChar(csCtx, programmer.x, programmer.y, '#00ff00', programmer.emotion || 'neutral');

            if (type === 'walk') {
                programmer.x = Math.min(programmer.x + 4, 180);
            } else if (type === 'sit') {
                programmer.emotion = 'neutral';
            } else if (type === 'boss_in') {
                boss.x = Math.max(boss.x - 6, 420);
                drawBossChar(csCtx, boss.x, boss.y);
            } else if (type === 'boss_out') {
                drawBossChar(csCtx, boss.x, boss.y);
                boss.x += 6;
                programmer.emotion = 'stressed';
            } else if (type === 'celebrate') {
                drawBossChar(csCtx, boss.x, boss.y + Math.sin(scene * 0.15) * 8);
                programmer.emotion = 'happy';
            } else if (type === 'dlog') {
                const [spk, txt, dur] = args;
                dialogue.style.display = 'block';
                speaker.textContent = spk + ' >';
                text.textContent = txt;
                boss.x = 420;
                drawBossChar(csCtx, boss.x, boss.y);
                programmer.emotion = spk === 'BOSS' ? 'stressed' : 'thinking';
            } else if (type === 'code') {
                drawScreen(csCtx, ['random_number_generator/', 'random_number_generator.py']);
                programmer.emotion = 'happy';
            } else if (type === 'msg') {
                drawScreen(csCtx, ['✓ Sent to boss']);
                programmer.emotion = 'happy';
            } else if (type === 'claude') {
                drawScreen(csCtx, ['random_number_generator_v1.py']);
            } else if (type === 'ai') {
                drawScreen(csCtx, ['v1.py', 'v2.py', 'uv.lock', 'pyproject.toml']);
            } else if (type === 'leader') {
                const place = args[0];
                drawScreen(csCtx, ['1.BOSS   9999', '2.YOU    ' + (place===1?9999:(6-place)*2000+500)]);
                programmer.emotion = place === 10 ? 'stressed' : (place === 1 ? 'happy' : 'neutral');
            } else if (type === 'loop') {
                drawScreen(csCtx, ['loop.py']);
            } else if (type === 'run') {
                drawScreen(csCtx, ['Running...']);
                tokens = Math.min(999, tokens + 5);
            } else if (type === 'recurs') {
                drawScreen(csCtx, ['loop.py', 'recursive.py']);
            } else if (type === 'run2') {
                tokens = Math.min(9999, tokens + 30);
            } else if (type === 'infinite') {
                programmer.emotion = 'happy';
                tokens += Math.floor(Math.random() * 50) + 15;
            }

            // Get duration for current scene
            let dur = 100;
            if (type === 'dlog') dur = args[2];
            else if (type === 'leader') dur = args[1];
            else if (type === 'walk') dur = 200;
            else if (type === 'boss_in') dur = 100;
            else if (type === 'boss_out') dur = 80;
            else if (type === 'code') dur = 150;
            else if (type === 'claude') dur = 150;
            else if (type === 'ai') dur = 150;
            else if (type === 'loop') dur = 120;
            else if (type === 'run') dur = 150;
            else if (type === 'recurs') dur = 100;
            else if (type === 'run2') dur = 120;
            else if (type === 'infinite') dur = 200;
            else if (type === 'sit') dur = 30;
            else if (type === 'msg') dur = 120;
            else if (type === 'celebrate') dur = 100;
            else if (type === 'game') dur = 1;

            if (timer >= dur) {
                timer = 0;
                scene++;
                dialogue.style.display = 'none';
            }

            requestAnimationFrame(update);
        }

        function startGame() {
            running = false;
            document.getElementById('skip-btn').style.display = 'none';
            csCanvas.style.display = 'none';
            dialogue.style.display = 'none';
            document.getElementById('score').style.display = 'block';
            document.getElementById('instructions').style.display = 'block';
            tokens = 0;
            obstacles = [];
            player.y = 270;
            player.vy = 0;
            requestAnimationFrame(gameLoop);
        }

        function spawn() {
            obstacles.push({x: 800, y: 288, w: 28, h: 28, s: 5 + Math.random() * 4});
        }

        function gameLoop() {
            scene++;
            obstacleTimer++;
            if (obstacleTimer > 45 + Math.random() * 45) { spawn(); obstacleTimer = 0; }
            obstacles.forEach(o => o.x -= o.s);
            obstacles = obstacles.filter(o => o.x > -50);
            if (!player.grounded) { player.vy += 0.6; player.y += player.vy; }
            if (player.y >= 270) { player.y = 270; player.vy = 0; player.grounded = true; }
            obstacles.forEach(o => {
                if (player.x < o.x + o.w && player.x + 28 > o.x && player.y < o.y + o.h && player.y + 48 > o.y) {
                    document.getElementById('game-over').style.display = 'flex';
                    document.getElementById('final-score').textContent = tokens;
                    return;
                }
            });
            tokens++;
            document.getElementById('score').textContent = 'TOKENS: ' + tokens;

            gpCtx.fillStyle = '#0a0a0a';
            gpCtx.fillRect(0, 0, 800, 360);
            gpCtx.fillStyle = '#003300';
            for (let i = 0; i < 40; i++) gpCtx.fillRect((i * 97 + scene * 0.15) % 800, (i * 53) % 180, 2, 2);
            gpCtx.fillStyle = '#002200';
            gpCtx.fillRect(0, 328, 800, 32);
            gpCtx.fillStyle = '#00ff00';
            gpCtx.fillRect(0, 328, 800, 2);
            drawChar(gpCtx, player.x, player.y, '#00ff00', 'neutral');
            obstacles.forEach(o => {
                gpCtx.fillStyle = '#ff0000';
                gpCtx.fillRect(o.x, o.y, o.w, o.h);
                gpCtx.fillStyle = '#ffff00';
                gpCtx.fillRect(o.x + 4, o.y + 4, 6, 6);
                gpCtx.fillRect(o.x + 16, o.y + 4, 6, 6);
            });

            if (document.getElementById('game-over').style.display !== 'flex') {
                requestAnimationFrame(gameLoop);
            }
        }

        function jump() {
            if (player.grounded && document.getElementById('game-over').style.display !== 'flex' && !running) {
                player.vy = -15;
                player.grounded = false;
            }
        }

        document.getElementById('skip-btn').onclick = startGame;
        document.getElementById('restart-btn').onclick = () => { document.getElementById('game-over').style.display = 'none'; startGame(); };
        document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); jump(); } });
        document.getElementById('game').onclick = jump;

        gpCanvas.style.display = 'none';
        update();
    </script>
</body>
</html>
