<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slopcannon.com</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'VT323', monospace;
            overflow: hidden;
        }
        #game-container { width: 800px; }
        #header {
            background: #00ff00;
            color: #000;
            padding: 8px 16px;
            font-size: 28px;
            text-align: center;
            letter-spacing: 4px;
        }
        #game {
            position: relative;
            width: 800px;
            height: 450px;
            background: #0a0a0a;
            border: 4px solid #00ff00;
            border-top: none;
            overflow: hidden;
        }
        #cutscene, #gameplay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 360px;
        }
        #dialogue-area {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 90px;
            background: #000;
            border-top: 3px solid #00ff00;
            padding: 12px 24px;
            display: none;
        }
        #speaker { color: #00ff00; font-size: 22px; margin-bottom: 6px; }
        #speaker:after { content: ' >'; }
        #text { color: #fff; font-size: 24px; line-height: 1.3; }
        #skip-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: transparent;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 8px 16px;
            font-family: 'VT323', monospace;
            font-size: 18px;
            cursor: pointer;
            z-index: 100;
        }
        #skip-btn:hover { background: #00ff00; color: #000; }
        #gameplay { display: none; }
        #score {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #00ff00;
            font-size: 28px;
            z-index: 10;
        }
        #instructions {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #004400;
            font-size: 20px;
            z-index: 10;
        }
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }
        #game-over h1 { color: #ff0000; font-size: 56px; margin-bottom: 20px; }
        #game-over p { color: #00ff00; font-size: 28px; margin-bottom: 40px; }
        #restart-btn {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 20px 40px;
            font-family: 'VT323', monospace;
            font-size: 24px;
            cursor: pointer;
        }
        canvas { display: block; image-rendering: pixelated; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="header">slopcannon.com</div>
        <div id="game">
            <button id="skip-btn">SKIP >></button>
            <div id="cutscene"><canvas id="cs-canvas" width="800" height="360"></canvas></div>
            <div id="dialogue-area"><div id="speaker"></div><div id="text"></div></div>
            <div id="gameplay"><canvas id="gp-canvas" width="800" height="360"></canvas><div id="score">TOKENS: 0</div><div id="instructions">[SPACE] to jump</div></div>
            <div id="game-over"><h1>GAME OVER</h1><p>Final Tokens: <span id="final-score">0</span></p><button id="restart-btn">PLAY AGAIN</button></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('cs-canvas');
        const ctx = canvas.getContext('2d');
        const gpCanvas = document.getElementById('gp-canvas');
        const gpCtx = gpCanvas.getContext('2d');
        const dialogueArea = document.getElementById('dialogue-area');
        const speakerEl = document.getElementById('speaker');
        const textEl = document.getElementById('text');
        const skipBtn = document.getElementById('skip-btn');
        const gameplay = document.getElementById('gameplay');
        const scoreEl = document.getElementById('score');
        const gameOver = document.getElementById('game-over');
        const finalScoreEl = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');

        let frame = 0, scene = 0, timer = 0, tokens = 0, gameRunning = false;
        const programmer = { x: -60, y: 230, sitting: false };
        const boss = { x: 860, y: 220 };
        const player = { x: 80, y: 270, vy: 0, grounded: true };
        let obstacles = [], obstacleTimer = 0;

        // Story with correct flow
        const story = [
            ['dlog', 180, 'NARRATOR', 'A programmer walks into work...'],
            ['walk', 180],           // 1: programmer walks in
            ['boss_in', 120],       // 2: boss walks in
            ['dlog', 240, 'BOSS', 'Think of a number between 1 and 10'],
            ['dlog', 180, 'PROGRAMMER', '7'],
            ['dlog', 240, 'BOSS', 'Great. Now automate that.'],
            ['boss_out', 100],      // 5: boss leaves - now programmer sits and works
            ['sit', 40],            // 6: programmer sits
            ['code', 200],          // 7: code appears
            ['msg', 180],           // 8: message sent to boss
            ['boss_in', 100],       // 9: boss returns
            ['dlog', 280, 'BOSS', "You're not using enough tokens!"],
            ['boss_out', 100],      // 11: boss leaves
            ['claude', 200],        // 12: get claude
            ['ai', 220],            // 13: ai code
            ['msg', 180],           // 14: message sent to boss
            ['boss_in', 100],       // 15: boss returns
            ['dlog', 320, 'BOSS', "Great! Check the dashboard. Don't fall behind."],
            ['boss_out', 100],      // 17: boss leaves
            ['leader', 250, 10],    // 18: show dashboard (last place)
            ['dlog', 200, 'PROGRAMMER', 'Claude, get me to first!'],
            ['loop', 180],          // 20: write loop.py
            ['run', 220],           // 21: run loop
            ['leader', 140, 9],     // 22: 2nd from last
            ['recurs', 140],        // 23: recursive
            ['run2', 180],          // 24: run recursive
            ['leader', 100, 7],     // 25: climbing
            ['leader', 100, 5],
            ['leader', 100, 3],
            ['leader', 160, 1],     // 28: 1st place
            ['dlog', 280, 'BOSS', "You're doing great! Keep it up!"],
            ['boss_celeb', 140],    // 30: boss celebrates
            ['infinite', 300],      // 31: infinite
            ['game', 1]
        ];

        function drawProg(x, y, emo, sitting) {
            const yOffset = sitting ? 25 : 0; // sit lower when at computer
            const legFold = sitting ? 15 : 0; // fold legs when sitting

            ctx.fillStyle = '#00ff00';
            // Body
            ctx.fillRect(x+16, y+yOffset+28, 24, 20);
            ctx.fillRect(x+12, y+yOffset+48, 32, 28 - legFold);
            // Head
            ctx.fillStyle = '#88ff88';
            ctx.fillRect(x+16, y+yOffset+8, 24, 20);
            ctx.fillRect(x+14, y+yOffset+10, 28, 18);
            // Hair
            ctx.fillStyle = '#006600';
            ctx.fillRect(x+14, y+yOffset+4, 28, 8);
            // Face
            ctx.fillStyle = '#004400';
            if (emo === 'happy') {
                ctx.fillRect(x+18, y+yOffset+14, 4, 4);
                ctx.fillRect(x+30, y+yOffset+14, 4, 4);
                ctx.fillRect(x+20, y+yOffset+22, 16, 2);
            } else if (emo === 'stressed') {
                ctx.fillRect(x+16, y+yOffset+12, 6, 3);
                ctx.fillRect(x+30, y+yOffset+12, 6, 3);
                ctx.fillRect(x+20, y+yOffset+24, 16, 2);
            } else if (emo === 'thinking') {
                ctx.fillRect(x+18, y+yOffset+14, 3, 3);
                ctx.fillRect(x+31, y+yOffset+14, 3, 3);
            } else {
                ctx.fillRect(x+18, y+yOffset+14, 4, 4);
                ctx.fillRect(x+30, y+yOffset+14, 4, 4);
            }
            // Arms (on keyboard when sitting)
            ctx.fillStyle = '#00ff00';
            if (sitting) {
                ctx.fillRect(x+30, y+yOffset+35, 14, 8); // arms forward
            } else {
                ctx.fillRect(x, y+yOffset+30, 14, 8);
                ctx.fillRect(x+42, y+yOffset+30, 14, 8);
            }
            // Legs
            ctx.fillRect(x+14, y+yOffset+76, 10, 20 - legFold);
            ctx.fillRect(x+32, y+yOffset+76, 10, 20 - legFold);
            // Glasses
            ctx.fillStyle = '#004400';
            ctx.fillRect(x+16, y+yOffset+14, 26, 2);
        }

        function drawBoss(x, y) {
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(x+12, y+28, 32, 24);
            ctx.fillRect(x+8, y+52, 40, 24);
            ctx.fillStyle = '#88ff88';
            ctx.fillRect(x+14, y+6, 28, 22);
            ctx.fillStyle = '#004400';
            ctx.fillRect(x+12, y, 32, 8);
            ctx.fillRect(x+16, y+12, 6, 4);
            ctx.fillRect(x+34, y+12, 6, 4);
            ctx.fillStyle = '#00aa00';
            ctx.fillRect(x+20, y+30, 16, 20);
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(x+24, y+32, 8, 14);
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(x+12, y+76, 12, 18);
            ctx.fillRect(x+32, y+76, 12, 18);
        }

        function drawDesk(x, y) {
            // Chair (positioned between programmer and desk)
            ctx.fillStyle = '#006600';
            ctx.fillRect(x - 30, y + 30, 25, 45);
            ctx.fillStyle = '#008800';
            ctx.fillRect(x - 30, y + 70, 25, 8);
            // Desk
            ctx.fillStyle = '#004400';
            ctx.fillRect(x - 20, y + 75, 140, 6);
            ctx.fillRect(x - 10, y + 81, 10, 35);
            ctx.fillRect(x + 70, y + 81, 10, 35);
        }

        function drawPC(x, y) {
            // Monitor on desk
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(x, y, 80, 55);
            ctx.fillStyle = '#001100';
            ctx.fillRect(x+3, y+3, 74, 49);
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(x+6, y+6, 68, 43);
            // Stand
            ctx.fillStyle = '#003300';
            ctx.fillRect(x+32, y+55, 16, 12);
            ctx.fillRect(x+20, y+67, 40, 3);
            // Keyboard
            ctx.fillStyle = '#004400';
            ctx.fillRect(x+10, y+78, 60, 5);
        }

        function drawFile(name, x, y) {
            ctx.fillStyle = '#00ff00';
            ctx.font = '14px VT323';
            ctx.fillText(name, x, y);
        }

        function drawFileOnScreen(files) {
            // Draw files on the computer screen (the green area)
            const screenX = 306; // 300 + 6
            const screenY = 186; // 180 + 6
            ctx.save();
            ctx.beginPath();
            ctx.rect(screenX, screenY, 68, 43);
            ctx.clip();
            ctx.fillStyle = '#00ff00';
            ctx.font = '10px VT323';
            let y = screenY + 12;
            files.forEach(f => {
                ctx.fillText(f, screenX + 4, y);
                y += 12;
            });
            ctx.restore();
        }

        function update() {
            frame++;
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, 800, 360);
            drawStars();
            ctx.fillStyle = '#002200';
            ctx.fillRect(0, 330, 800, 30);
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(0, 330, 800, 2);

            if (scene >= story.length) { startGame(); return; }

            const [type, dur, ...args] = story[scene];
            timer++;

            drawDesk(250, 180);
            drawPC(300, 180);
            drawProg(programmer.x, programmer.y, programmer.emotion || 'neutral', programmer.sitting);

            if (type === 'walk') {
                programmer.x = Math.min(programmer.x + 5, 120);
            } else if (type === 'sit') {
                programmer.sitting = true;
            } else if (type === 'boss_in') {
                // Ensure boss starts from right side
                if (boss.x < 400) boss.x = 860;
                boss.x = Math.max(boss.x - 5, 420);
                drawBoss(boss.x, boss.y);
            } else if (type === 'boss_out') {
                drawBoss(boss.x, boss.y);
                boss.x += 5;
                programmer.emotion = 'stressed';
            } else if (type === 'boss_celeb') {
                drawBoss(boss.x, boss.y + Math.sin(frame * 0.15) * 8);
                programmer.emotion = 'happy';
            } else if (type === 'dlog') {
                const [spk, txt] = args;
                dialogueArea.style.display = 'block';
                speakerEl.textContent = spk;
                textEl.textContent = txt;
                // Position boss for dialogue
                if (boss.x > 500 || boss.x < 300) boss.x = 420;
                drawBoss(boss.x, boss.y);
                programmer.emotion = spk === 'BOSS' ? 'stressed' : 'thinking';
            } else if (type === 'code') {
                drawFileOnScreen(['random_number_generator/', 'random_number_generator.py']);
                programmer.emotion = 'happy';
            } else if (type === 'msg') {
                drawFileOnScreen(['✓ Message sent to boss']);
                programmer.emotion = 'happy';
            } else if (type === 'claude') {
                drawFileOnScreen(['random_number_generator_v1.py']);
                ctx.fillStyle = '#00ff00'; ctx.font = '18px VT323';
                ctx.fillText('Downloading Claude...', 250, 145);
            } else if (type === 'ai') {
                drawFileOnScreen(['random_number_generator_v1.py', 'random_number_generator_v2.py', 'uv.lock', 'pyproject.toml']);
            } else if (type === 'leader') {
                // Show leaderboard on computer screen
                const screenX = 306;
                const screenY = 46;
                ctx.save();
                ctx.beginPath();
                ctx.rect(screenX, screenY, 68, 43);
                ctx.clip();
                ctx.fillStyle = '#00ff00';
                ctx.font = '8px VT323';
                const names = ['YOU', 'BOSS', 'SARAH', 'MIKE', 'JENNY'];
                const scores = [args[0]===1?9999:(6-args[0])*2000+500, 9999, 7500, 5000, 2500];
                for(let i=0; i<5; i++) {
                    ctx.fillStyle = (i+1)===args[0] ? '#ffff00' : '#00ff00';
                    ctx.fillText((i+1)+'.'+names[i]+' '+scores[i], screenX+2, screenY+10+i*8);
                }
                ctx.restore();
                programmer.emotion = args[0] === 10 ? 'stressed' : (args[0] === 1 ? 'happy' : 'neutral');
            } else if (type === 'loop') {
                drawFileOnScreen(['loop.py']);
                ctx.fillStyle = '#00ff00'; ctx.font = '18px VT323';
                ctx.fillText('$ python3 loop.py', 250, 130);
            } else if (type === 'run') {
                drawFileOnScreen(['loop.py']);
                ctx.fillStyle = '#00ff00'; ctx.font = '24px VT323';
                ctx.fillText('Running...', 250, 110);
                tokens = Math.min(999, tokens + 5);
                ctx.fillText('TOKENS: ' + tokens, 250, 150);
            } else if (type === 'recurs') {
                drawFileOnScreen(['loop.py', 'recursive_loop.py']);
            } else if (type === 'run2') {
                tokens = Math.min(9999, tokens + 30);
                ctx.fillStyle = '#00ff00'; ctx.font = '32px VT323';
                ctx.fillText('TOKENS: ' + tokens, 250, 120);
                ctx.font = '22px VT323';
                ctx.fillText('Running recursive...', 250, 160);
            } else if (type === 'infinite') {
                programmer.emotion = 'happy';
                tokens += Math.floor(Math.random() * 50) + 15;
                ctx.fillStyle = '#00ff00'; ctx.font = '36px VT323';
                ctx.fillText('TOKENS: ' + tokens, 250, 90);
                if (frame % 4 === 0) ctx.fillRect(320 + Math.random() * 80, 80 + Math.random() * 40, 6, 6);
            }

            if (timer >= dur) {
                timer = 0;
                scene++;
                dialogueArea.style.display = 'none';
            }

            requestAnimationFrame(update);
        }

        function startGame() {
            skipBtn.style.display = 'none';
            document.getElementById('cutscene').style.display = 'none';
            dialogueArea.style.display = 'none';
            gameplay.style.display = 'block';
            gameRunning = true;
            tokens = 0;
            obstacles = [];
            player.y = 270;
            player.vy = 0;
            gpLoop();
        }

        function spawn() {
            obstacles.push({ x: 800, y: 288, w: 28, h: 28, s: 5 + Math.random() * 4 });
        }

        function updateGame() {
            frame++;
            obstacleTimer++;
            if (obstacleTimer > 45 + Math.random() * 45) { spawn(); obstacleTimer = 0; }
            obstacles.forEach(o => o.x -= o.s);
            obstacles = obstacles.filter(o => o.x > -50);
            if (!player.grounded) { player.vy += 0.6; player.y += player.vy; }
            if (player.y >= 270) { player.y = 270; player.vy = 0; player.grounded = true; }
            obstacles.forEach(o => {
                if (player.x < o.x + o.w && player.x + 28 > o.x && player.y < o.y + o.h && player.y + 48 > o.y) {
                    gameRunning = false;
                    finalScoreEl.textContent = tokens;
                    gameOver.style.display = 'flex';
                }
            });
            tokens++;
            scoreEl.textContent = 'TOKENS: ' + tokens;
        }

        function drawGame() {
            gpCtx.fillStyle = '#0a0a0a';
            gpCtx.fillRect(0, 0, 800, 360);
            gpCtx.fillStyle = '#003300';
            for (let i = 0; i < 40; i++) gpCtx.fillRect((i * 97 + frame * 0.15) % 800, (i * 53) % 180, 2, 2);
            gpCtx.fillStyle = '#002200';
            gpCtx.fillRect(0, 328, 800, 32);
            gpCtx.fillStyle = '#00ff00';
            gpCtx.fillRect(0, 328, 800, 2);
            // Player
            gpCtx.fillStyle = '#00ff00';
            gpCtx.fillRect(player.x + 16, player.y + 28, 24, 20);
            gpCtx.fillRect(player.x + 12, player.y + 48, 32, 28);
            gpCtx.fillStyle = '#88ff88';
            gpCtx.fillRect(player.x + 16, player.y + 8, 24, 20);
            gpCtx.fillRect(player.x + 14, player.y + 10, 28, 18);
            gpCtx.fillStyle = '#006600';
            gpCtx.fillRect(player.x + 14, player.y + 4, 28, 8);
            gpCtx.fillStyle = '#004400';
            gpCtx.fillRect(player.x + 18, player.y + 14, 4, 4);
            gpCtx.fillRect(player.x + 30, player.y + 14, 4, 4);
            gpCtx.fillStyle = '#00ff00';
            gpCtx.fillRect(player.x, player.y + 30, 14, 8);
            gpCtx.fillRect(player.x + 42, player.y + 30, 14, 8);
            gpCtx.fillRect(player.x + 14, player.y + 76, 10, 20);
            gpCtx.fillRect(player.x + 32, player.y + 76, 10, 20);
            // Obstacles
            obstacles.forEach(o => {
                gpCtx.fillStyle = '#ff0000';
                gpCtx.fillRect(o.x, o.y, o.w, o.h);
                gpCtx.fillStyle = '#ffff00';
                gpCtx.fillRect(o.x + 4, o.y + 4, 6, 6);
                gpCtx.fillRect(o.x + 16, o.y + 4, 6, 6);
            });
        }

        function gpLoop() {
            if (!gameRunning) return;
            updateGame();
            drawGame();
            requestAnimationFrame(gpLoop);
        }

        function jump() {
            if (player.grounded && gameRunning) { player.vy = -15; player.grounded = false; }
        }

        skipBtn.onclick = startGame;
        restartBtn.onclick = () => { gameOver.style.display = 'none'; startGame(); };
        document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); jump(); } });
        document.getElementById('game').onclick = jump;

        update();
    </script>
</body>
</html>
