<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kenny - Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="terminal" id="terminal">
        <div class="status-bar">
            <div class="status-left">
                <span class="status-item mode" id="statusMode">NORMAL</span>
                <span class="status-item">ls</span>
                <span class="status-item">help</span>
            </div>
            <div class="status-right">
                <span class="status-item" id="statusDir">~</span>
                <span class="status-item">UTF-8</span>
            </div>
        </div>
        <div class="terminal-content">
            <div class="output-wrapper">
                <div class="output" id="output"></div>
            </div>
            <div class="input-area">
                <span class="prompt" id="prompt">kenny@portfolio:~$</span>
                <input type="text" id="commandInput" autocomplete="off" spellcheck="false" autofocus>
            </div>
        </div>
    </div>
    <script src="js/core/filesystem.js"></script>
    <script src="js/core/parser.js"></script>
    <script src="js/core/commands.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
