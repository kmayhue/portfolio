<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kenny - Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="mode-toggle">
        <button id="modeBtn" onclick="toggleMode()">mode: terminal</button>
    </div>

    <div class="terminal" id="terminal">
        <div class="output" id="output"></div>
        <div class="input-line">
            <span class="prompt">kenny@portfolio:~$</span>
            <input type="text" id="commandInput" autocomplete="off" spellcheck="false" autofocus>
        </div>
    </div>

    <div class="gui" id="gui" style="display: none;">
        <nav class="gui-nav">
            <a href="#" onclick="showGuiFile('about')">About</a>
            <a href="#" onclick="showGuiFile('projects')">Projects</a>
            <a href="#" onclick="showGuiFile('resume')">Resume</a>
            <a href="#" onclick="showGuiFile('contact')">Contact</a>
            <a href="slopcannon.html">Play Game</a>
        </nav>
        <div class="gui-content" id="guiContent">
            <h1>Welcome</h1>
            <p>Click a link above to explore.</p>
        </div>
    </div>

    <script src="js/terminal.js"></script>
</body>
</html>
